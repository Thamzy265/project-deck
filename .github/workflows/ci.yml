name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # M5: the plugin and both marketplaces pass Claude Code's own validator. Once, on
      # Ubuntu and Node 22. Pinned CLI (>= 2.1.281 checks .mcp.json entries); validate
      # needs no login or API key. Its home and config live in the runner's temp folder.
      - name: claude plugin validate --strict
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.317
          claude --version
          claude plugin validate --strict ./plugin
          claude plugin validate --strict .
          node scripts/dev-marketplace.mjs
          claude plugin validate --strict ./plugin-dev/marketplace

  # Dashboard end-to-end tests (Playwright, Chromium) against the built daemon.
  # Ubuntu only: the browser download is large, and the unit tests cover the OS matrix.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @project-deck/dashboard exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-e2e
          path: qa-artifacts/m2-dashboard/
          retention-days: 7

  # M5: install the packed pitdeck package (not the workspace) with --ignore-scripts and
  # run it: npx, the daemon in fake mode, the dashboard, and the MCP server over stdio.
  # It also starts plugin/.mcp.json's command (npx -y pitdeck@<pin> mcp) through the MCP
  # SDK's stdio transport, against a 127.0.0.1 registry that serves only the tarball.
  # 22.12 is the lowest Node in "engines".
  tarball-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/smoke/tarball.mjs

  # PM decision R1, 14 Oct 2026: CI runs the sample app's Flutter tests.
  # Ubuntu only to save runner minutes; the repo-hygiene tests are not
  # exercised on macOS or Windows. The SDK version matches .metadata.
  sample-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/sample_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  # The in-app Drift helper (M3). Pure Dart, so the Flutter SDK's dart runs
  # it. Ubuntu only, like the sample app. package:sqlite3's build hook
  # downloads its prebuilt SQLite library on the first run.
  pitdeck-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dart/pitdeck_drift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
